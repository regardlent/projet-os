name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex: v1.0)"
        required: true
        default: v1.0

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW + CMake
        run: choco install mingw cmake -y --no-progress

      - name: Configure + build + package (CPack ZIP)
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          cmake -S cli-cpp -B cli-cpp/cmake-build -G "MinGW Makefiles"
          cmake --build cli-cpp/cmake-build
          (cd cli-cpp && cmake --build cmake-build --target package 2>/dev/null || true)

      - name: Copy archive to workspace
        shell: bash
        run: |
          ls -la cli-cpp/*.zip 2>/dev/null || true
          cp cli-cpp/project-os-cli-*.zip ./project-os-cli.zip 2>/dev/null || echo "no zip produced"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ inputs.tag }}" }
          $notes = "docs/RELEASE_NOTES_$tag.md"
          if (-not (Test-Path $notes)) { $notes = "docs/RELEASE_NOTES_v1.0.md" }
          if (Test-Path ./project-os-cli.zip) {
            gh release create $tag --repo "regardlent/projet-os" --title "Project OS CLI $tag" --notes-file $notes ./project-os-cli.zip
          } else {
            gh release create $tag --repo "regardlent/projet-os" --title "Project OS CLI $tag" --notes-file docs/RELEASE_NOTES_v1.0.md --generate-notes
          }
          echo "release published for $tag"
