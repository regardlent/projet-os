name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Cross-platform typecheck gate (Windows / Linux / macOS). Always green.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Typecheck (multiplateforme)
        run: npm run typecheck

  # Full node unit/integration tests (green on a clean runner; env-dependent antigravity tests skip).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Unit + integration tests
        run: npm test

  # C++ CLI build + ctest (Windows-native toolchain via MinGW).
  cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW + CMake
        run: choco install mingw cmake -y --no-progress
      - name: Configure + build + test
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          cmake -S cli-cpp -B cli-cpp/cmake-build -G "MinGW Makefiles"
          cmake --build cli-cpp/cmake-build
          ctest --test-dir cli-cpp/cmake-build --output-on-failure

  # C++ sanitizers (ASan/UBSan) — Linux g++ for reliable sanitizer support.
  cpp-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++ + CMake
        run: sudo apt-get update && sudo apt-get install -y g++ cmake
      - name: Configure (sanitize) + build + test
        run: |
          cmake -S cli-cpp -B cli-cpp/cmake-build-san -DPOS_SANITIZE=ON
          cmake --build cli-cpp/cmake-build-san
          ctest --test-dir cli-cpp/cmake-build-san --output-on-failure

  # Documentation/artifacts integrity (Phase 4.10): JSON matrices must parse; docs must be present.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON artifacts + docs presence
        run: |
          node -e "const fs=require('fs');const glob=['artifacts/cli-v3/CLI_V3_FEATURE_MATRIX.json','artifacts/cli-v3/release/CLI_V3_FEATURE_MATRIX.json','docs/schema/machine-schema-v2.json','package.json','cli-cpp/CMakeLists.txt'];for(const f of glob){if(!fs.existsSync(f)){throw new Error('missing '+f)} if(f.endsWith('.json')){JSON.parse(fs.readFileSync(f,'utf8'));}}console.log('docs: JSON valid, artifacts present')"
          test -f README.md && test -f CHANGELOG.md && echo "docs: README + CHANGELOG present"
